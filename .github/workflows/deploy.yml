name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Artifact target used when Publish is disabled
        required: true
        default: main
        type: choice
        options:
          - main
          - uie
      publish:
        description: Publish to GitHub Releases and CurseForge
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing release tag; required only when Publish is enabled
        required: false
        type: string
  pull_request:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'uie/[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: build-deploy-${{ inputs.release_tag || github.ref }}-${{ inputs.target || 'auto' }}
  cancel-in-progress: false

jobs:
  release-meta:
    name: Resolve release target
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_tag || github.ref }}

      - name: Validate tag and configured version
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_TARGET: ${{ inputs.target }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "kind=ci" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '\r' | xargs)"
          uie_version="$(sed -n 's/^ui_enhancements_version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '\r' | xargs)"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" != "true" ]]; then
            if [[ "$MANUAL_TARGET" == "main" ]]; then
              version="$main_version"
            elif [[ "$MANUAL_TARGET" == "uie" ]]; then
              version="$uie_version"
            else
              echo "Unsupported artifact target '$MANUAL_TARGET'." >&2
              exit 1
            fi
            echo "kind=$MANUAL_TARGET" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$MANUAL_TAG" ]]; then
              echo "release_tag is required when Publish is enabled." >&2
              exit 1
            fi
            tag="$MANUAL_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            kind="main"
            version="$tag"
            configured="$main_version"
          elif [[ "$tag" =~ ^uie/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            kind="uie"
            version="${BASH_REMATCH[1]}"
            configured="$uie_version"
          else
            echo "Unsupported release tag '$tag'. Expected X.Y.Z or uie/X.Y.Z." >&2
            exit 1
          fi

          if [[ "$version" != "$configured" ]]; then
            echo "Tag version '$version' does not match configured $kind version '$configured'." >&2
            exit 1
          fi

          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  cosmic-native:
    name: Cosmic ${{ matrix.resource }}
    needs: release-meta
    if: needs.release-meta.outputs.kind != 'uie'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            resource: windows-x86_64
            library: neofontrender_cosmic.dll
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            resource: windows-aarch64
            library: neofontrender_cosmic.dll
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            resource: linux-x86_64-gnu
            library: libneofontrender_cosmic.so
            libc: gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            resource: linux-x86_64-musl
            library: libneofontrender_cosmic.so
            libc: musl
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            resource: linux-aarch64-gnu
            library: libneofontrender_cosmic.so
            libc: gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            resource: linux-aarch64-musl
            library: libneofontrender_cosmic.so
            libc: musl
          - runner: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
            resource: linux-loongarch64-gnu
            library: libneofontrender_cosmic.so
            libc: gnu
          - runner: ubuntu-latest
            target: loongarch64-unknown-linux-musl
            resource: linux-loongarch64-musl
            library: libneofontrender_cosmic.so
            libc: musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            resource: macos-x86_64
            library: libneofontrender_cosmic.dylib
          - runner: macos-14
            target: aarch64-apple-darwin
            resource: macos-aarch64
            library: libneofontrender_cosmic.dylib
          - runner: ubuntu-latest
            target: aarch64-linux-android
            resource: android-aarch64
            library: libneofontrender_cosmic.so

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.ref }}

      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/cosmic-text
          key: ${{ matrix.target }}

      - name: Install cross
        if: contains(matrix.target, 'linux')
        run: >-
          cargo install cross
          --git https://github.com/cross-rs/cross
          --rev 154b4ead7e639c7597d9e4e626b9c1c1e37608c0
          --locked

      - name: Build native library
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == *-linux-* ]]; then
            if [[ "${{ matrix.libc }}" == "musl" ]]; then
              export RUSTFLAGS="-C target-feature=-crt-static"
            fi
            cross build --manifest-path native/cosmic-text/Cargo.toml --release --locked --target "${{ matrix.target }}"
          else
            cargo build --manifest-path native/cosmic-text/Cargo.toml --release --locked --target "${{ matrix.target }}"
          fi
          mkdir -p "dist/${{ matrix.resource }}"
          cp "native/cosmic-text/target/${{ matrix.target }}/release/${{ matrix.library }}" \
            "dist/${{ matrix.resource }}/${{ matrix.library }}"

      - name: Verify Linux libc linkage
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          library="dist/${{ matrix.resource }}/${{ matrix.library }}"
          dynamic="$(readelf -d "$library")"
          if [[ "${{ matrix.libc }}" == "musl" ]] && grep -Eq 'libc\.so\.6|ld-linux' <<<"$dynamic"; then
            echo "musl native unexpectedly depends on glibc" >&2
            exit 1
          fi

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-${{ matrix.resource }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  package-main:
    name: Package and publish main mod
    needs: [release-meta, cosmic-native]
    if: needs.release-meta.outputs.kind != 'uie'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.ref }}

      - name: Grant execute permission for Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: zulu
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download all Cosmic natives
        uses: actions/download-artifact@v4
        with:
          pattern: cosmic-*
          path: cosmic-natives
          merge-multiple: true

      - name: Validate native bundle
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            windows-x86_64/neofontrender_cosmic.dll
            windows-aarch64/neofontrender_cosmic.dll
            linux-x86_64-gnu/libneofontrender_cosmic.so
            linux-x86_64-musl/libneofontrender_cosmic.so
            linux-aarch64-gnu/libneofontrender_cosmic.so
            linux-aarch64-musl/libneofontrender_cosmic.so
            linux-loongarch64-gnu/libneofontrender_cosmic.so
            linux-loongarch64-musl/libneofontrender_cosmic.so
            macos-x86_64/libneofontrender_cosmic.dylib
            macos-aarch64/libneofontrender_cosmic.dylib
            android-aarch64/libneofontrender_cosmic.so
          )
          for library in "${expected[@]}"; do
            test -s "cosmic-natives/$library" || { echo "Missing Cosmic native: $library" >&2; exit 1; }
          done

      - name: Build and stage main distributions
        run: >-
          ./gradlew stageMainRelease
          -PcosmicNativeBundleDir="${{ github.workspace }}/cosmic-natives"
          --no-daemon

      - name: Verify staged main distributions
        shell: bash
        run: |
          set -euo pipefail
          directory="build/release/main"
          shopt -s nullglob
          archives=("$directory"/*.jar)
          cores=("$directory"/*-core.jar)
          resources=("$directory"/neofontrender-resources-*.jar)
          [[ ${#archives[@]} -eq 3 ]] || { echo "Expected exactly 3 main release JARs" >&2; exit 1; }
          [[ ${#cores[@]} -eq 1 ]] || { echo "Expected exactly one core JAR" >&2; exit 1; }
          [[ ${#resources[@]} -eq 1 ]] || { echo "Expected exactly one resources JAR" >&2; exit 1; }

          core="${cores[0]}"
          resource="${resources[0]}"
          full=""
          for archive in "${archives[@]}"; do
            test -s "$archive"
            if [[ "$archive" != "$core" && "$archive" != "$resource" ]]; then
              [[ -z "$full" ]] || { echo "Found more than one full distribution candidate" >&2; exit 1; }
              full="$archive"
            fi
          done
          [[ -n "$full" ]] || { echo "Missing full distribution" >&2; exit 1; }

          full_entries="$(jar tf "$full")"
          core_entries="$(jar tf "$core")"
          for entry in \
            assets/neofontrender/natives/windows-x86_64/neofontrender_cosmic.dll \
            assets/neofontrender/natives/windows-aarch64/neofontrender_cosmic.dll \
            assets/neofontrender/natives/linux-x86_64-gnu/libneofontrender_cosmic.so \
            assets/neofontrender/natives/linux-x86_64-musl/libneofontrender_cosmic.so \
            assets/neofontrender/natives/linux-aarch64-gnu/libneofontrender_cosmic.so \
            assets/neofontrender/natives/linux-aarch64-musl/libneofontrender_cosmic.so \
            assets/neofontrender/natives/linux-loongarch64-gnu/libneofontrender_cosmic.so \
            assets/neofontrender/natives/linux-loongarch64-musl/libneofontrender_cosmic.so \
            assets/neofontrender/natives/macos-x86_64/libneofontrender_cosmic.dylib \
            assets/neofontrender/natives/macos-aarch64/libneofontrender_cosmic.dylib \
            assets/neofontrender/natives/android-aarch64/libneofontrender_cosmic.so; do
            grep -Fxq "$entry" <<<"$full_entries" || { echo "Full JAR is missing $entry" >&2; exit 1; }
            grep -Fxq "$entry" <<<"$core_entries" || { echo "Core JAR is missing $entry" >&2; exit 1; }
          done
          if grep -Eq '^assets/neofontrender/fonts/' <<<"$core_entries"; then
            echo "Core JAR contains bundled font content" >&2
            exit 1
          fi

      - name: Upload main workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neofontrender-${{ needs.release-meta.outputs.version || 'ci' }}
          path: build/release/main/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish main release to GitHub and CurseForge
        if: needs.release-meta.outputs.kind == 'main' && needs.release-meta.outputs.publish == 'true'
        uses: Kira-NT/mc-publish@v3
        with:
          files: build/release/main/*.jar
          name: Revo Font ${{ needs.release-meta.outputs.version }}
          version: ${{ needs.release-meta.outputs.version }}
          version-type: release
          loaders: forge
          game-versions: 1.12.2
          game-version-filter: none
          environment: client
          curseforge-id: 1617673
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-tag: ${{ needs.release-meta.outputs.tag }}
          github-generate-changelog: true
          github-token: ${{ github.token }}
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail

  package-uie:
    name: Package and publish Revo UI
    needs: release-meta
    if: needs.release-meta.outputs.kind == 'uie'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.ref }}
          submodules: recursive

      - name: Grant execute permission for Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and stage Revo UI
        run: ./gradlew :addons:ui-enhancements:stageUiEnhancementsRelease --no-daemon

      - name: Verify staged Revo UI JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(build/release/uie/*.jar)
          [[ ${#archives[@]} -eq 1 ]] || { echo "Expected exactly one Revo UI release JAR" >&2; exit 1; }
          jar="${archives[0]}"
          test -s "$jar"
          [[ "$jar" != *-dev.jar && "$jar" != *-sources.jar && "$jar" != *-shadow.jar ]]
          entries="$(jar tf "$jar")"
          grep -Fxq 'mcmod.info' <<<"$entries"
          grep -Fxq 'mixins.neofontrender_ui_enhancements.json' <<<"$entries"
          grep -Fxq 'neofontrender/addons/mixin/UiEnhancementsMixinLoader.class' <<<"$entries"
          grep -Fxq 'META-INF/LICENSE-Tiqian.txt' <<<"$entries"
          grep -Fxq 'META-INF/NOTICE-Tiqian.md' <<<"$entries"
          grep -q 'nfr-tiqian-jvm' <<<"$entries"

      - name: Upload Revo UI workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neofontrender-ui-enhancements-${{ needs.release-meta.outputs.version }}
          path: build/release/uie/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish Revo UI to GitHub and CurseForge
        if: needs.release-meta.outputs.publish == 'true'
        uses: Kira-NT/mc-publish@v3
        with:
          files: build/release/uie/*.jar
          name: Revo UI ${{ needs.release-meta.outputs.version }}
          version: ${{ needs.release-meta.outputs.version }}
          version-type: release
          loaders: forge
          game-versions: 1.12.2
          game-version-filter: none
          environment: client
          curseforge-id: 1620532
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-tag: ${{ needs.release-meta.outputs.tag }}
          github-generate-changelog: true
          github-token: ${{ github.token }}
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail
