plugins {
    id 'java-library'
}

group = 'neofontrender.addons'
version = providers.gradleProperty('ui_enhancements_server_version').get()

base {
    archivesName = 'neofontrender-ui-enhancements-server'
}

configurations {
    contain
    runtimeOnlyNonPublishable
    implementation.extendsFrom(contain)
    runtimeClasspath.extendsFrom(runtimeOnlyNonPublishable)
}

repositories {
    mavenCentral()
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    maven { url = 'https://maven.cleanroommc.com/' }
    maven { url = 'https://repo.cleanroommc.com/releases' }
}

sourceSets {
    main {
        java.srcDir '../ui-enhancements-common/src/main/java'
    }
}

dependencies {
    compileOnly project(':')
    compileOnly files(rootProject.configurations.compileClasspath)

    contain 'com.h2database:h2:2.3.232'

    annotationProcessor files(provider {
        rootProject.configurations.compileClasspath.findAll { it.name.startsWith('unimixins-') }
    })

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation project(':')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly files(rootProject.tasks.named('compileJava').get().classpath)
    testRuntimeOnly files(rootProject.sourceSets.main.output)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    classpath += rootProject.tasks.named('compileJava').get().classpath
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def reobfuscatedJarType = rootProject.ext.reobfuscatedJarType
def rootReobfJar = rootProject.tasks.named('reobfJar', reobfuscatedJarType)
def mixinSrg = layout.buildDirectory.file('tmp/mixins/mixins.neofontrender_ui_enhancements_server.srg')
def mixinRefMap = layout.buildDirectory.file('tmp/mixins/mixins.neofontrender_ui_enhancements_server-refmap.json')
tasks.named('compileJava', JavaCompile) {
    def reobfSrg = rootReobfJar.get().srg.locationOnly.get().asFile
    inputs.file(rootReobfJar.flatMap { it.srg })
    outputs.files(mixinSrg, mixinRefMap)
    options.compilerArgs.addAll(
            "-AreobfSrgFile=${reobfSrg}",
            "-AoutSrgFile=${mixinSrg.get().asFile}",
            "-AoutRefMapFile=${mixinRefMap.get().asFile}")
}

def resourceVersion = project.version.toString()
def issueTracker = rootProject.mod_issue_tracker
processResources {
    inputs.property('version', resourceVersion)
    inputs.property('issueTracker', issueTracker)
    filesMatching('mcmod.info') {
        expand(version: resourceVersion, issueTracker: issueTracker)
    }
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Unpack contained dependencies flat into the jar. The ContainedDeps nested-jar mechanism
    // does not come online for this dev-launched coremod on 1.7.10, leaving classes unreadable.
    //
    // CurseForge rejected the bundle because the full H2 engine ships unused capabilities
    // (TCP/PG/Web servers, Console/Shell/RunScript tools, JNDI DataSource, full-text, external
    // auth). Only the embedded file-database JDBC subset is used for chat-history persistence,
    // so drop those classes while unpacking H2. Classes the core engine actually references
    // (Csv, CompressTool, SimpleResultSet, TriggerAdapter, Recover, DeleteDbFiles) are kept.
    from(provider {
        configurations.contain.collect { file ->
            if (file.isDirectory()) return file
            if (file.name.startsWith('h2-')) {
                return zipTree(file).matching {
                    exclude 'org/h2/server/**'
                    exclude 'org/h2/tools/Server*'
                    exclude 'org/h2/fulltext/**'
                    exclude 'org/h2/jdbcx/**'
                    exclude 'org/h2/bnf/**'
                    exclude 'org/h2/jmx/**'
                    exclude 'org/h2/security/auth/impl/**'
                    exclude 'org/h2/tools/Console*'
                    exclude 'org/h2/tools/GUIConsole*'
                    exclude 'org/h2/tools/Shell*'
                    exclude 'org/h2/tools/RunScript*'
                    exclude 'org/h2/tools/Script*'
                    exclude 'org/h2/tools/CreateCluster*'
                    exclude 'org/h2/tools/Backup*'
                    exclude 'org/h2/tools/Restore*'
                    exclude 'org/h2/tools/ChangeFileEncryption*'
                    exclude 'org/h2/tools/ConvertTraceFile*'
                    exclude 'org/h2/tools/MultiDimension*'
                    exclude 'org/h2/tools/Upgrade*'
                    exclude 'org/h2/util/OsgiDataSourceFactory*'
                }
            }
            return zipTree(file)
        }
    })
    from(mixinRefMap)
    manifest.attributes(
            'FMLCorePlugin': 'neofontrender.addons.server.UiEnhancementsServerMixinLoader',
            'FMLCorePluginContainsFMLMod': 'true')
}

tasks.register('reobfJar', reobfuscatedJarType) {
    setInputJarFromTask(tasks.named('jar', Jar))
    archiveClassifier = ''
    mcVersion.set(rootReobfJar.flatMap { it.mcVersion })
    srg.set(rootReobfJar.flatMap { it.srg })
    fieldCsv.set(rootReobfJar.flatMap { it.fieldCsv })
    methodCsv.set(rootReobfJar.flatMap { it.methodCsv })
    exceptorCfg.set(rootReobfJar.flatMap { it.exceptorCfg })
    recompMcJar.set(rootReobfJar.flatMap { it.recompMcJar })
    extraSrgEntries.set(rootReobfJar.flatMap { it.extraSrgEntries })
    extraSrgFiles.from(rootReobfJar.map { it.extraSrgFiles }, mixinSrg)
    referenceClasspath.from(rootReobfJar.map { it.referenceClasspath }, sourceSets.main.compileClasspath)
}

tasks.named('assemble') {
    dependsOn tasks.named('reobfJar')
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) })
}
