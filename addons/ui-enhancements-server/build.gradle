plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.26-kappa'
}

group = 'neofontrender.addons'
version = providers.gradleProperty('ui_enhancements_server_version').get()

base { archivesName = 'neofontrender-ui-enhancements-server' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.cleanroommc.com/releases' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

configurations {
    contain
    implementation.extendsFrom(contain)
}

sourceSets {
    main {
        java.srcDir '../ui-enhancements-common/src/main/java'
    }
}

dependencies {
    // Embedded SQL database backing server-side chat persistence.
    contain 'com.h2database:h2:2.3.232'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

unimined.minecraft {
    version '1.12.2'
    mappings { mcp('stable', '39-1.12') }
    cleanroom { loader '0.6.1-alpha' }
    defaultRemapJar = false
    remap(tasks.named('jar').get())
}

processResources {
    inputs.property('version', project.version)
    inputs.property('issueTracker', rootProject.mod_issue_tracker)
    filesMatching('mcmod.info') {
        expand(version: project.version, issueTracker: rootProject.mod_issue_tracker)
    }
    from(rootProject.file('addons/ui-enhancements/src/main/resources/assets/neofontrender_ui_enhancements/logo.png')) {
        into 'assets/neofontrender_ui_enhancements'
    }
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(configurations.contain) { into '/' }
    doFirst {
        def attributes = [
                'ModType': 'CRL',
                'FMLCorePlugin': 'neofontrender.addons.server.UiEnhancementsServerMixinLoader',
                'FMLCorePluginContainsFMLMod': true
        ]
        if (!configurations.contain.isEmpty()) {
            attributes['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
            attributes['NonModDeps'] = true
        }
        manifest.attributes(attributes)
    }
    finalizedBy tasks.named('remapJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) })
}

tasks.named('genSources') {
    enabled = false
}

// Unimined wires Minecraft and Forge to main after source-set creation.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
