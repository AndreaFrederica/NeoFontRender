plugins {
    id 'java'
    id 'java-library'
    id 'xyz.wagyourtail.unimined' version '1.4.26-kappa'
}

group = 'neofontrender.addons'
version = nfrVersion('typst_renderer_version')
base { archivesName = 'neofontrender-typst-renderer' }

java { toolchain { languageVersion = JavaLanguageVersion.of(nfrVersion('java_version').toInteger()) } }

evaluationDependsOn(':engine:typst-render')
def typstEngine = project(':engine:typst-render')

repositories {
    mavenCentral()
    maven { url = 'https://repo.cleanroommc.com/releases' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

unimined.minecraft {
    version nfrVersion('minecraft_version')
    mappings { mcp(nfrVersion('minecraft_mappings_channel'), nfrVersion('minecraft_mappings_version')) }
    cleanroom { loader nfrVersion('cleanroom_version'); runs.off = true }
    defaultRemapJar = false
    remap(tasks.named('jar').get())
}

dependencies {
    compileOnly project(':')
    compileOnly project(':addons:ui-enhancements')
    compileOnly project(':engine:text-core')
    compileOnly("com.cleanroommc:modularui:${nfrVersion('modularui_version')}") { transitive = false }
    implementation typstEngine
    testImplementation project(':')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property('version', project.version)
    inputs.property('nfrVersion', nfrVersion('mod_version'))
    filesMatching('mcmod.info') {
        expand(version: project.version,
                nfrVersion: nfrVersion('mod_version'))
    }
    from('NOTICE.md') { into 'META-INF'; rename { 'NOTICE-NFR-TYPST-RENDERER.md' } }
    from('vendor/typst/LICENSE') { into 'META-INF'; rename { 'LICENSE-Typst.txt' } }
    from('vendor/typst/NOTICE') { into 'META-INF'; rename { 'NOTICE-Typst.txt' } }
}

jar {
    dependsOn typstEngine.tasks.named('jar')
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(typstEngine.tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    manifest.attributes('ModType': 'CRL')
    finalizedBy tasks.named('remapJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(nfrVersion('java_version').toInteger()) })
}

tasks.register('verifyBundledTypstNative') {
    group = 'verification'
    description = 'Verifies that the addon JAR contains the isolated Typst JNI module.'
    dependsOn tasks.named('remapJar')
    doLast {
        def archive = tasks.named('remapJar').get().archiveFile.get().asFile
        def file = new java.util.jar.JarFile(archive)
        try {
            typstEngine.typstNativeEntries.each { relative ->
                def expected = "assets/neofontrender/typst-native/${relative}"
                def entry = file.getJarEntry(expected)
                if (entry == null || entry.size <= 0) {
                    throw new GradleException("Typst addon JAR is missing ${expected}")
                }
            }
            if (file.getJarEntry('neofontrender/typst/TypstEngine.class') == null) {
                throw new GradleException('Typst addon JAR is missing the isolated Java engine')
            }
        } finally {
            file.close()
        }
    }
}

tasks.register('stageTypstRendererRelease', Sync) {
    group = 'build'
    description = 'Stages the verified installable Typst addon (not the development JAR).'
    dependsOn tasks.named('check')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into rootProject.layout.buildDirectory.dir('release/typst-renderer')
}

tasks.named('check') {
    dependsOn tasks.named('verifyBundledTypstNative')
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.register('prepareCombinedClientRun', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into rootProject.layout.projectDirectory.dir('run/client/mods')
    rename { 'neofontrender-typst-renderer-dev.jar' }
}
