plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.26-kappa'
}

group = 'neofontrender.addons'
version = providers.gradleProperty('mui_xml_showcase_version').get()

base { archivesName = 'neofontrender-mui-xml-showcase' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.cleanroommc.com/releases' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://cursemaven.com' }
}

unimined.minecraft {
    version '1.12.2'
    mappings { mcp('stable', '39-1.12') }
    cleanroom {
        loader '0.6.12'
        runs.off = true
    }
    defaultRemapJar = false
    remap(tasks.named('jar').get())
}

dependencies {
    def localModularUiPath = project.findProperty('local_modularui_jar')?.toString()?.trim()
    if (localModularUiPath) {
        compileOnly files(file(localModularUiPath))
        testImplementation files(file(localModularUiPath))
    } else {
        compileOnly("com.cleanroommc:modularui:${providers.gradleProperty('modularui_version').get()}") { transitive = false }
        testImplementation("com.cleanroommc:modularui:${providers.gradleProperty('modularui_version').get()}") { transitive = false }
    }
    compileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    testImplementation 'curse.maven:neverenoughanimation-1062347:6533650-sources-6533651'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property('version', project.version)
    inputs.property('modularuiVersion', providers.gradleProperty('modularui_version').get())
    filesMatching('mcmod.info') {
        expand(version: project.version,
                modularuiVersion: providers.gradleProperty('modularui_version').get())
    }
}

jar {
    archiveClassifier = 'dev'
    manifest.attributes('ModType': 'CRL')
    finalizedBy tasks.named('remapJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) })
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.register('prepareCombinedClientRun', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into rootProject.layout.projectDirectory.dir('run/client/mods')
    rename { 'neofontrender-mui-xml-showcase-dev.jar' }
}
